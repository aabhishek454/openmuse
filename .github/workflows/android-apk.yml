name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Point screens.tsx at the configurable API URL
        run: |
          sed -i 's|import { API_URL } from "./api";|import { getApiUrl } from "./api";|' apps/mobile/src/screens.tsx
          sed -i 's|`${API_URL}/api/files`|`${getApiUrl()}/api/files`|' apps/mobile/src/screens.tsx
          grep -q 'getApiUrl()}/api/files' apps/mobile/src/screens.tsx

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/mobile typecheck

      - name: Expo prebuild (Android)
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: 'true'
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install

      - name: Create signing keystore
        run: |
          mkdir -p $HOME/.android
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore $HOME/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (debug-signed)
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - uses: actions/upload-artifact@v4
        with:
          name: openmuse-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
